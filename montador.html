document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"6df6092d-62fd-447c-9d2c-04d6f1ae6da6\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n  \n  <style>/* ============================================================\n   Unimed Uberlândia — Fonts\n   Official brand typefaces (proprietary — licensed by Unimed).\n   Primary: Unimed Sans. Display/accent: Unimed Slab, Unimed Serif.\n   Paths are relative to this file; @font-face src urls are resolved\n   against tokens/fonts.css.\n   ============================================================ */\n\n/* ---------- Unimed Sans (primary) ---------- */\n@font-face {\n  font-family: 'Unimed Sans';\n  src: url(\"63acfa8e-6aa2-453e-805d-154b3881249c\") format('opentype');\n  font-weight: 300; font-style: normal; font-display: swap;\n}\n@font-face {\n  font-family: 'Unimed Sans';\n  src: url(\"566aa70e-f5eb-4eb9-8c9a-9b4c8ad03a62\") format('opentype');\n  font-weight: 400; font-style: normal; font-display: swap;\n}\n@font-face {\n  font-family: 'Unimed Sans';\n  src: url(\"3c4ff89a-5f97-4c84-82d1-17c8fee63b1d\") format('opentype');\n  font-weight: 400; font-style: italic; font-display: swap;\n}\n@font-face {\n  font-family: 'Unimed Sans';\n  src: url(\"0b211f28-ad78-480d-9924-366a049cc8b7\") format('opentype');\n  font-weight: 500; font-style: normal; font-display: swap;\n}\n@font-face {\n  font-family: 'Unimed Sans';\n  src: url(\"c0ec5c2d-015d-44fe-9230-b4a2b22d437a\") format('opentype');\n  font-weight: 600; font-style: normal; font-display: swap;\n}\n@font-face {\n  font-family: 'Unimed Sans';\n  src: url(\"122cea2c-0bae-4bd5-a946-80113e1e48f1\") format('opentype');\n  font-weight: 700; font-style: normal; font-display: swap;\n}\n@font-face {\n  font-family: 'Unimed Sans';\n  src: url(\"37c7ef5e-c1ef-436d-b144-28c70416e623\") format('opentype');\n  font-weight: 700; font-style: italic; font-display: swap;\n}\n@font-face {\n  font-family: 'Unimed Sans';\n  src: url(\"33b5071f-e763-456d-9c4f-23ef135f0f5d\") format('opentype');\n  font-weight: 800; font-style: normal; font-display: swap;\n}\n@font-face {\n  font-family: 'Unimed Sans';\n  src: url(\"ed73028b-c9f1-4816-bebc-c1a4eaaf6f65\") format('opentype');\n  font-weight: 900; font-style: normal; font-display: swap;\n}\n\n/* ---------- Unimed Slab (display / accent) ---------- */\n@font-face {\n  font-family: 'Unimed Slab';\n  src: url(\"2b176926-d32f-4d2e-8dec-a6ddc13e1516\") format('opentype');\n  font-weight: 400; font-style: normal; font-display: swap;\n}\n@font-face {\n  font-family: 'Unimed Slab';\n  src: url(\"01ce3742-a333-4e29-a4d3-9e19612ece8b\") format('opentype');\n  font-weight: 600; font-style: normal; font-display: swap;\n}\n@font-face {\n  font-family: 'Unimed Slab';\n  src: url(\"60e7db39-ee59-415b-b4a0-d31a6fcd9117\") format('opentype');\n  font-weight: 700; font-style: normal; font-display: swap;\n}\n\n/* ---------- Unimed Serif (editorial / accent) ---------- */\n@font-face {\n  font-family: 'Unimed Serif';\n  src: url(\"fd2c87e5-641c-4bf0-90fb-6df69c1c5c50\") format('opentype');\n  font-weight: 400; font-style: normal; font-display: swap;\n}\n@font-face {\n  font-family: 'Unimed Serif';\n  src: url(\"dfc31e7a-323d-4ea4-878e-7a6efbd05a2d\") format('opentype');\n  font-weight: 700; font-style: normal; font-display: swap;\n}\n<\u002Fstyle>\n  <style>/* ============================================================\n   Unimed Uberlândia — Color tokens\n   Primary palette + pastel support colors from the brand palette\n   (Palheta de cores / Manual de Aplicação da Marca).\n   Verde Institucional is always the protagonist. Orange is an\n   accent used sparingly and never as a background for the logo.\n   ============================================================ */\n:root {\n  /* ---- Primary brand palette ---- */\n  --green-institucional: #00995d; /* Pantone 348c — protagonist */\n  --green-citrico:       #b1d34b; /* Pantone 381c — energy / highlight */\n  --green-petroleo:      #004e4c; /* Pantone 7722c — depth / dark surfaces */\n  --orange:              #f47920; /* Pantone 1585c — vibrant accent, use sparingly */\n  --white:               #ffffff;\n  --black:               #1a1a1a; /* monochrome substitution per manual */\n\n  /* ---- Pastel support colors (Cores complementares) ---- */\n  --pastel-terracota: #d2a494; /* Pantone 7521c */\n  --pastel-rosa:      #f1cdcd; /* Pantone 691c  */\n  --pastel-areia:     #ece3d9; /* Pantone 7527c — warm page wash */\n  --pastel-amarelo:   #ffe596; /* Pantone 1205c */\n  --pastel-verde:     #cde3bb; /* Pantone 7485c */\n  --pastel-azul:      #a4d8de; /* Pantone 304c  */\n\n  /* ---- Institutional green ramp (tints/shades of #00995d) ---- */\n  --green-50:  #e6f6ef;\n  --green-100: #c4ebd9;\n  --green-200: #8fd9b8;\n  --green-300: #54c393;\n  --green-400: #1faf74;\n  --green-500: #00995d; /* base */\n  --green-600: #008252;\n  --green-700: #006b45;\n  --green-800: #015439;\n  --green-900: #073f2d;\n\n  /* ---- Citric ramp ---- */\n  --citric-100: #eef6d2;\n  --citric-200: #dcecaa;\n  --citric-300: #c8e07e;\n  --citric-400: #b1d34b; /* base */\n  --citric-500: #97bb33;\n  --citric-600: #7a9b25;\n\n  /* ---- Warm neutrals (tinted toward petróleo/areia for warmth) ---- */\n  --neutral-0:   #ffffff;\n  --neutral-25:  #fbfaf7; /* near-white warm page */\n  --neutral-50:  #f5f3ee;\n  --neutral-100: #ece8e0;\n  --neutral-200: #ddd8cd;\n  --neutral-300: #c3bcae;\n  --neutral-400: #9a9384;\n  --neutral-500: #736d61;\n  --neutral-600: #555046;\n  --neutral-700: #3c382f;\n  --neutral-800: #28251f;\n  --neutral-900: #16140f;\n\n  /* ============================================================\n     Semantic aliases — reference these in components\n     ============================================================ */\n  --color-primary:        var(--green-institucional);\n  --color-primary-hover:  var(--green-600);\n  --color-primary-active: var(--green-700);\n  --color-primary-soft:   var(--green-50);\n  --color-accent:         var(--green-citrico);\n  --color-accent-strong:  var(--citric-600);\n  --color-dark:           var(--green-petroleo);\n  --color-highlight:      var(--orange); /* sparingly */\n\n  --surface-page:    var(--neutral-25);\n  --surface-wash:    var(--pastel-areia);\n  --surface-card:    var(--white);\n  --surface-sunken:  var(--neutral-50);\n  --surface-dark:    var(--green-petroleo);\n  --surface-brand:   var(--green-institucional);\n\n  --text-strong:   var(--neutral-900);\n  --text-body:     var(--neutral-700);\n  --text-muted:    var(--neutral-500);\n  --text-on-dark:  rgba(255, 255, 255, 0.92);\n  --text-on-dark-muted: rgba(255, 255, 255, 0.66);\n  --text-on-primary: var(--white);\n  --text-link:     var(--green-700);\n\n  --border-subtle:  var(--neutral-100);\n  --border-default: var(--neutral-200);\n  --border-strong:  var(--neutral-300);\n  --border-brand:   var(--green-200);\n\n  /* ---- Feedback ---- */\n  --color-success:    #00995d;\n  --color-success-bg: #e6f6ef;\n  --color-warning:    #e08a1e;\n  --color-warning-bg: #fff2d9;\n  --color-danger:     #d64545;\n  --color-danger-bg:  #fbe6e6;\n  --color-info:       #2f7d9a;\n  --color-info-bg:    #e3f1f5;\n\n  --focus-ring: 0 0 0 3px rgba(0, 153, 93, 0.32);\n}\n<\u002Fstyle>\n  <script src=\"f1621fb2-0acd-44cd-aa55-160f30f2704f\"><\u002Fscript>\n  <script src=\"9fd71ee3-695d-43ba-b666-4128ee9b3ae0\"><\u002Fscript>\n  <script src=\"7e8aab39-c4cd-4c71-80a2-ca26e2ef231a\"><\u002Fscript>\n  <style>\n    *{margin:0;padding:0;box-sizing:border-box}\n    body{font-family:'Unimed Sans','Source Sans 3',system-ui,sans-serif;background:#f2efe9;-webkit-font-smoothing:antialiased}\n    a{color:#00995d;text-decoration:none}\n    a:hover{color:#004e4c}\n    input,textarea,button,select{font-family:inherit}\n    ::-webkit-scrollbar{width:10px;height:10px}\n    ::-webkit-scrollbar-track{background:transparent}\n    ::-webkit-scrollbar-thumb{background:#d8d4cc;border-radius:5px;border:2px solid transparent;background-clip:content-box}\n    ::-webkit-scrollbar-thumb:hover{background:#b9b4a9;background-clip:content-box}\n    [contenteditable]:focus{outline:none}\n    [contenteditable] p{margin:0 0 10px}\n    [contenteditable] p:last-child{margin-bottom:0}\n    [contenteditable] ul,[contenteditable] ol{margin:8px 0 10px 20px}\n    [contenteditable] li{margin-bottom:4px}\n    [contenteditable]:empty:before{content:attr(data-ph);color:#b4afa4}\n    @keyframes riseIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}\n    @keyframes fadeIn{from{opacity:0}to{opacity:1}}\n    @keyframes spin{to{transform:rotate(360deg)}}\n  <\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"height:100vh;display:flex;flex-direction:column;overflow:hidden;background:#f2efe9\">\n\n  <header style=\"flex-shrink:0;background:linear-gradient(135deg,#00995d 0%,#004e4c 100%);padding:0 28px;height:68px;display:flex;align-items:center;justify-content:space-between;gap:24px\">\n    <div style=\"display:flex;align-items:center;gap:16px;min-width:0\">\n      <div style=\"width:34px;height:34px;border-radius:9px;background:rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;flex-shrink:0\">\n        <svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#b1d34b\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 19.5A2.5 2.5 0 0 1 6.5 17H20\"><\u002Fpath><path d=\"M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z\"><\u002Fpath><\u002Fsvg>\n      <\u002Fdiv>\n      <div style=\"min-width:0\">\n        <div style=\"font-size:15px;font-weight:800;color:#fff;letter-spacing:-.01em\">Montador de Informativo<\u002Fdiv>\n        <div style=\"font-size:11px;color:rgba(255,255,255,.55);margin-top:1px\">Unimed Uberlândia · uso interno<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;align-items:center;gap:10px;flex-shrink:0\">\n      <input type=\"file\" accept=\".docx\" style=\"display:none\" ref=\"{{ setFileEl }}\" sc-camel-on-change=\"{{ onFile }}\">\n      <button sc-camel-on-click=\"{{ pedirArquivo }}\" style=\"display:flex;align-items:center;gap:8px;height:38px;padding:0 18px;border:0;border-radius:9px;background:#b1d34b;color:#004e4c;font-size:13px;font-weight:800;cursor:pointer;white-space:nowrap;flex-shrink:0;transition:transform .15s,box-shadow .2s\" style-hover=\"transform:translateY(-1px);box-shadow:0 6px 18px rgba(177,211,75,.35)\">\n        <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4\"><\u002Fpath><polyline points=\"17 8 12 3 7 8\"><\u002Fpolyline><line x1=\"12\" y1=\"3\" x2=\"12\" y2=\"15\"><\u002Fline><\u002Fsvg>\n        Importar Word\n      <\u002Fbutton>\n      <button sc-camel-on-click=\"{{ novaEdicao }}\" style=\"display:flex;align-items:center;gap:7px;height:38px;padding:0 16px;border:1px solid rgba(255,255,255,.22);border-radius:9px;background:rgba(255,255,255,.08);color:#fff;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;flex-shrink:0;transition:background .18s\" style-hover=\"background:rgba(255,255,255,.16)\">\n        <svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" style=\"flex-shrink:0\"><line x1=\"12\" y1=\"5\" x2=\"12\" y2=\"19\"><\u002Fline><line x1=\"5\" y1=\"12\" x2=\"19\" y2=\"12\"><\u002Fline><\u002Fsvg>\n        Nova edição\n      <\u002Fbutton>\n      <button sc-camel-on-click=\"{{ togglePreview }}\" title=\"Mostrar ou esconder o espelho\" style=\"{{ btnTogglePreview }}\">\n        <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z\"><\u002Fpath><circle cx=\"12\" cy=\"12\" r=\"3\"><\u002Fcircle><\u002Fsvg>\n        Espelho\n      <\u002Fbutton>\n      <button sc-camel-on-click=\"{{ gerarEmbed }}\" style=\"display:flex;align-items:center;gap:8px;height:38px;padding:0 18px;border:0;border-radius:9px;background:#fff;color:#004e4c;font-size:13px;font-weight:800;cursor:pointer;white-space:nowrap;flex-shrink:0;transition:transform .15s,box-shadow .2s\" style-hover=\"transform:translateY(-1px);box-shadow:0 6px 18px rgba(0,0,0,.18)\">\n        <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"16 18 22 12 16 6\"><\u002Fpolyline><polyline points=\"8 6 2 12 8 18\"><\u002Fpolyline><\u002Fsvg>\n        Gerar embed\n      <\u002Fbutton>\n      <button sc-camel-on-click=\"{{ abrirGh }}\" title=\"Conexão com o GitHub\" style=\"{{ btnGh }}\">\n        <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"currentColor\"><path d=\"M12 .3a12 12 0 0 0-3.8 23.4c.6.1.8-.3.8-.6v-2c-3.3.7-4-1.6-4-1.6-.6-1.4-1.4-1.8-1.4-1.8-1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1 1.8 2.8 1.3 3.5 1 .1-.8.4-1.3.7-1.6-2.7-.3-5.5-1.3-5.5-5.9 0-1.3.5-2.4 1.2-3.2 0-.4-.5-1.6.2-3.2 0 0 1-.3 3.3 1.2a11.5 11.5 0 0 1 6 0c2.3-1.5 3.3-1.2 3.3-1.2.7 1.6.2 2.8.1 3.2.8.8 1.2 1.9 1.2 3.2 0 4.6-2.8 5.6-5.5 5.9.4.4.8 1.1.8 2.2v3.3c0 .3.2.7.8.6A12 12 0 0 0 12 .3\"><\u002Fpath><\u002Fsvg>\n      <\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <div ref=\"{{ setShellEl }}\" style=\"flex:1;display:flex;min-height:0;position:relative\">\n\n    <aside style=\"width:288px;min-width:214px;background:#fff;border-right:1px solid #e4e0d8;display:flex;flex-direction:column;min-height:0\">\n      <div style=\"padding:20px 20px 12px\">\n        <div style=\"font-size:10px;font-weight:800;color:#00995d;letter-spacing:.12em;text-transform:uppercase\">Edições<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex:1;overflow-y:auto;padding:0 12px 20px\">\n        <sc-if value=\"{{ semEdicoes }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"padding:28px 16px;text-align:center\">\n            <div style=\"font-size:13px;color:#8b8578;line-height:1.55\">Comece importando o Word da semana.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-for list=\"{{ listaEdicoes }}\" as=\"e\" hint-placeholder-count=\"3\">\n          <div sc-camel-on-click=\"{{ e.abrir }}\" style=\"{{ e.estilo }}\">\n            <div style=\"{{ e.estiloData }}\">\n              <div style=\"font-size:16px;font-weight:900;line-height:1;color:{{ e.corData }}\">{{ e.dia }}<\u002Fdiv>\n              <div style=\"font-size:8px;font-weight:800;text-transform:uppercase;color:{{ e.corData }}\">{{ e.mes }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"flex:1;min-width:0\">\n              <div style=\"font-size:13px;font-weight:700;color:#1f2420;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ e.rotulo }}<\u002Fdiv>\n              <div style=\"font-size:11px;color:#8b8578;margin-top:2px\">{{ e.resumo }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"{{ e.estiloBadge }}\">{{ e.badge }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n\n        <div style=\"margin-top:22px;padding-top:18px;border-top:1px solid #eeeae2\">\n          <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;padding:0 8px\">\n            <div style=\"font-size:10px;font-weight:800;color:#8b8578;letter-spacing:.12em;text-transform:uppercase\">Arquivo Framer<\u002Fdiv>\n            <button sc-camel-on-click=\"{{ addLegado }}\" style=\"width:22px;height:22px;border:0;border-radius:6px;background:#f2efe9;color:#00995d;font-size:15px;font-weight:800;line-height:1;cursor:pointer;transition:background .15s\" style-hover=\"background:#e6f5ee\">+<\u002Fbutton>\n          <\u002Fdiv>\n          <div style=\"font-size:11px;color:#a49e91;line-height:1.5;padding:0 8px 10px\">Links das edições antigas que continuam hospedadas no Framer. Aparecem na trilha de edições do informativo.<\u002Fdiv>\n          <sc-for list=\"{{ listaLegados }}\" as=\"l\" hint-placeholder-count=\"0\">\n            <div style=\"padding:8px;border-radius:8px;background:#faf8f4;margin-bottom:6px;display:flex;flex-direction:column;gap:5px\">\n              <input value=\"{{ l.rotulo }}\" sc-camel-on-change=\"{{ l.setRotulo }}\" placeholder=\"18 de julho de 2026\" style=\"width:100%;height:28px;padding:0 8px;border:1px solid #e4e0d8;border-radius:6px;background:#fff;font-size:12px;font-weight:600;color:#1f2420\">\n              <div style=\"display:flex;gap:5px\">\n                <input value=\"{{ l.link }}\" sc-camel-on-change=\"{{ l.setLink }}\" placeholder=\"https://…\" style=\"flex:1;min-width:0;height:28px;padding:0 8px;border:1px solid #e4e0d8;border-radius:6px;background:#fff;font-size:11px;color:#5c574d\">\n                <button sc-camel-on-click=\"{{ l.remover }}\" style=\"width:28px;height:28px;flex-shrink:0;border:1px solid #f0dfd2;border-radius:6px;background:#fff;color:#f47920;cursor:pointer;display:flex;align-items:center;justify-content:center\" style-hover=\"background:#fff3e0\">\n                  <svg width=\"12\" height=\"12\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\"><line x1=\"18\" y1=\"6\" x2=\"6\" y2=\"18\"><\u002Fline><line x1=\"6\" y1=\"6\" x2=\"18\" y2=\"18\"><\u002Fline><\u002Fsvg>\n                <\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Faside>\n\n    <main style=\"flex:1;overflow-y:auto;min-width:420px;padding:24px 28px 80px\">\n      <sc-if value=\"{{ temSelecao }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"max-width:760 lor\" stroke-width=\"2.6\" stroke-linecap=\"round\"><line x1=\"12\" y1=\"5\" x2=\"12\" y2=\"19\"><\u002Fline><line x1=\"5\" y1=\"12\" x2=\"19\" y2=\"12\"><\u002Fline><\u002Fsvg>\n            Adicionar pauta\n          <\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ semSelecao }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"max-width:520px;margin:80px auto;text-align:center;background:#fff;border-radius:18px;border:1px solid #e4e0d8;padding:52px 40px\">\n          <div style=\"width:56px;height:56px;border-radius:15px;background:#e6f5ee;display:flex;align-items:center;justify-content:center;margin:0 auto 20px\">\n            <svg width=\"26\" height=\"26\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#00995d\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z\"><\u002Fpath><polyline points=\"14 2 14 8 20 8\"><\u002Fpolyline><\u002Fsvg>\n          <\u002Fdiv>\n          <div style=\"font-size:20px;font-weight:800;color:#004e4c;margin-bottom:10px\">Comece pelo Word da semana<\u002Fdiv>\n          <div style=\"font-size:14px;color:#8b8578;line-height:1.6;margin-bottom:26px\">Arraste o documento que a analista mantém online. O montador quebra em pautas, preserva negrito e itálico, e você só ajusta o que precisa.<\u002Fdiv>\n          <button sc-camel-on-click=\"{{ pedirArquivo }}\" style=\"height:44px;padding:0 26px;border:0;border-radius:10px;background:#00995d;color:#fff;font-size:14px;font-weight:800;cursor:pointer;transition:transform .15s,box-shadow .2s\" style-hover=\"transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,153,93,.3)\">Importar Word<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fmain>\n\n    <sc-if value=\"{{ mostrarPreview }}\" hint-placeholder-val=\"{{ true }}\">\n      <aside style=\"{{ estiloPreview }}\">\n        <div style=\"flex-shrink:0;height:52px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid #e4e0d8;background:#faf8f4\">\n          <div style=\"font-size:11px;font-weight:800;color:#8b8578;letter-spacing:.1em;text-transform:uppercase\">Espelho<\u002Fdiv>\n          <div style=\"display:flex;gap:4px;background:#f2efe9;padding:3px;border-radius:8px\">\n            <button sc-camel-on-click=\"{{ verOnline }}\" style=\"{{ btnVerOnline }}\">Home<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ verEspelho }}\" style=\"{{ btnVerEspelho }}\">/espelho<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex:1;min-height:0;background:#fff\">\n          <iframe sc-camel-src-doc=\"{{ srcDoc }}\" title=\"Espelho do informativo\" style=\"width:100%;height:100%;border:0;display:block\"><\u002Fiframe>\n        <\u002Fdiv>\n      <\u002Faside>\n    <\u002Fsc-if>\n\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ modalEmbed }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed;inset:0;background:rgba(15,30,25,.55);display:flex;align-items:center;justify-content:center;padding:40px;z-index:500;animation:fadeIn .18s ease both\">\n      <div style=\"background:#fff;border-radius:18px;width:100%;max-width:720px;max-height:100%;display:flex;flex-direction:column;overflow:hidden;animation:riseIn .25s ease both\">\n        <div style=\"flex-shrink:0;padding:22px 26px;border-bottom:1px solid #e4e0d8;display:flex;align-items:flex-start;justify-content:space-between;gap:16px\">\n          <div>\n            <div style=\"font-size:17px;font-weight:800;color:#004e4c\">Código para o Framer<\u002Fdiv>\n            <div style=\"font-size:13px;color:#8b8578;margin-top:4px;line-height:1.5\">Cole em um bloco <strong>Embed / HTML<\u002Fstrong> na home e também na página /espelho. O mesmo código serve nas duas — ele detecta a rota.<\u002Fdiv>\n          <\u002Fdiv>\n          <button sc-camel-on-click=\"{{ fecharModal }}\" style=\"width:32px;height:32px;flex-shrink:0;border:1px solid #e4e0d8;border-radius:9px;background:#fff;color:#5c574d;cursor:pointer;display:flex;align-items:center;justify-content:center\" style-hover=\"background:#f2efe9\">\n            <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\"><line x1=\"18\" y1=\"6\" x2=\"6\" y2=\"18\"><\u002Fline><line x1=\"6\" y1=\"6\" x2=\"18\" y2=\"18\"><\u002Fline><\u002Fsvg>\n          <\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"flex:1;min-height:0;padding:20px 26px;overflow:hidden;display:flex;flex-direction:column;gap:14px\">\n          <div style=\"display:flex;gap:10px;flex-wrap:wrap\">\n            <button sc-camel-on-click=\"{{ copiarEmbed }}\" style=\"display:flex;align-items:center;gap:8px;height:40px;padding:0 20px;border:0;border-radius:10px;background:#00995d;color:#fff;font-size:13px;font-weight:800;cursor:pointer;transition:transform .15s\" style-hover=\"transform:translateY(-1px)\">\n              <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"9\" y=\"9\" width=\"13\" height=\"13\" rx=\"2\"><\u002Frect><path d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\"><\u002Fpath><\u002Fsvg>\n              {{ rotuloCopiar }}\n            <\u002Fbutton>\n            <button sc-camel-on-click=\"{{ baixarEmbed }}\" style=\"display:flex;align-items:center;gap:8px;height:40px;padding:0 18px;border:1px solid #e4e0d8;border-radius:10px;background:#fff;color:#004e4c;font-size:13px;font-weight:700;cursor:pointer\" style-hover=\"background:#f2efe9\">\n              <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4\"><\u002Fpath><polyline points=\"7 10 12 15 17 10\"><\u002Fpolyline><line x1=\"12\" y1=\"15\" x2=\"12\" y2=\"3\"><\u002Fline><\u002Fsvg>\n              Baixar .html\n            <\u002Fbutton>\n            <div style=\"display:flex;align-items:center;font-size:12px;color:#8b8578;font-weight:600\">{{ tamanhoEmbed }}<\u002Fdiv>\n          <\u002Fdiv>\n          <textarea sc-camel-read-only=\"{{ true }}\" value=\"{{ embedCodigo }}\" style=\"flex:1;min-height:220px;padding:14px;border:1px solid #e4e0d8;border-radius:10px;background:#faf8f4;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;line-height:1.5;color:#5c574d;resize:none\"><\u002Ftextarea>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ modalGh }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed;inset:0;background:rgba(15,30,25,.55);display:flex;align-items:center;justify-content:center;padding:32px;z-index:520;animation:fadeIn .18s ease both\">\n      <div style=\"background:#fff;border-radius:18px;width:100%;max-width:560px;max-height:100%;display:flex;flex-direction:column;overflow:hidden;animation:riseIn .25s ease both\">\n        <div style=\"flex-shrink:0;padding:22px 26px;border-bottom:1px solid #e4e0d8;display:flex;align-items:flex-start;justify-content:space-between;gap:16px\">\n          <div>\n            <div style=\"font-size:17px;font-weight:800;color:#004e4c\">Publicar direto no GitHub<\u002Fdiv>\n            <div style=\"font-size:13px;color:#8b8578;margin-top:4px;line-height:1.5\">Com isso configurado, o botão Publicar envia o informativo para o repositório e o site atualiza sozinho.<\u002Fdiv>\n          <\u002Fdiv>\n          <button sc-camel-on-click=\"{{ fecharGh }}\" style=\"width:32px;height:32px;flex-shrink:0;border:1px solid #e4e0d8;border-radius:9px;background:#fff;color:#5c574d;cursor:pointer;display:flex;align-items:center;justify-content:center\" style-hover=\"background:#f2efe9\">\n            <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\"><line x1=\"18\" y1=\"6\" x2=\"6\" y2=\"18\"><\u002Fline><line x1=\"6\" y1=\"6\" x2=\"18\" y2=\"18\"><\u002Fline><\u002Fsvg>\n          <\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"flex:1;min-height:0;overflow-y:auto;padding:22px 26px;display:flex;flex-direction:column;gap:16px\">\n          <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:12px\">\n            <div>\n              <div style=\"font-size:10px;font-weight:800;color:#8b8578;letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px\">Usuário ou organização<\u002Fdiv>\n              <input value=\"{{ ghOwner }}\" sc-camel-on-change=\"{{ setGhOwner }}\" placeholder=\"unimed-uberlandia\" style=\"width:100%;height:38px;padding:0 12px;border:1.5px solid #e4e0d8;border-radius:9px;background:#faf8f4;font-size:13px;color:#3a3630\" style-focus=\"border-color:#00995d;background:#fff\">\n            <\u002Fdiv>\n            <div>\n              <div style=\"font-size:10px;font-weight:800;color:#8b8578;letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px\">Repositório<\u002Fdiv>\n              <input value=\"{{ ghRepo }}\" sc-camel-on-change=\"{{ setGhRepo }}\" placeholder=\"informativo-cooperado\" style=\"width:100%;height:38px;padding:0 12px;border:1.5px solid #e4e0d8;border-radius:9px;background:#faf8f4;font-size:13px;color:#3a3630\" style-focus=\"border-color:#00995d;background:#fff\">\n            <\u002Fdiv>\n            <div>\n              <div style=\"font-size:10px;font-weight:800;color:#8b8578;letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px\">Branch<\u002Fdiv>\n              <input value=\"{{ ghBranch }}\" sc-camel-on-change=\"{{ setGhBranch }}\" placeholder=\"main\" style=\"width:100%;height:38px;padding:0 12px;border:1.5px solid #e4e0d8;border-radius:9px;background:#faf8f4;font-size:13px;color:#3a3630\" style-focus=\"border-color:#00995d;background:#fff\">\n            <\u002Fdiv>\n            <div>\n              <div style=\"font-size:10px;font-weight:800;color:#8b8578;letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px\">Arquivo<\u002Fdiv>\n              <input value=\"{{ ghPath }}\" sc-camel-on-change=\"{{ setGhPath }}\" placeholder=\"index.html\" style=\"width:100%;height:38px;padding:0 12px;border:1.5px solid #e4e0d8;border-radius:9px;background:#faf8f4;font-size:13px;color:#3a3630\" style-focus=\"border-color:#00995d;background:#fff\">\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <div style=\"font-size:10px;font-weight:800;color:#8b8578;letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px\">Token de acesso<\u002Fdiv>\n            <input type=\"password\" value=\"{{ ghToken }}\" sc-camel-on-change=\"{{ setGhToken }}\" placeholder=\"github_pat_…\" style=\"width:100%;height:38px;padding:0 12px;border:1.5px solid #e4e0d8;border-radius:9px;background:#faf8f4;font-size:13px;font-family:ui-monospace,Menlo,monospace;color:#3a3630\" style-focus=\"border-color:#00995d;background:#fff\">\n            <div style=\"font-size:11.5px;color:#a49e91;margin-top:7px;line-height:1.55\">Fica guardado só neste navegador, nunca sai daqui a não ser para o GitHub. Use um <strong>fine-grained token<\u002Fstrong> limitado a este repositório, permissão <strong>Contents: Read and write<\u002Fstrong>, com data de validade.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:10px;align-items:center;flex-wrap:wrap\">\n            <button sc-camel-on-click=\"{{ testarGh }}\" style=\"height:38px;padding:0 18px;border:1.5px solid #00995d;border-radius:9px;background:#fff;color:#00995d;font-size:13px;font-weight:800;cursor:pointer;white-space:nowrap\" style-hover=\"background:#e6f5ee\">Testar conexão<\u002Fbutton>\n            <div style=\"{{ ghStatusEstilo }}\">{{ ghStatus }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:#eef6f0;border-radius:11px;padding:16px 18px;font-size:12.5px;color:#00573a;line-height:1.65\">\n            <strong>Passo a passo, uma vez só:<\u002Fstrong><br>\n            1. Crie o repositório no GitHub e ative o <strong>Pages<\u002Fstrong> (Settings → Pages → branch main).<br>\n            2. Gere o token em <em>Settings → Developer settings → Fine-grained tokens<\u002Fem>.<br>\n            3. Preencha os campos acima e teste.<br>\n            4. No Framer, embede o endereço do Pages num bloco de Embed. Nunca mais mexa nele.\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ toast }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:#004e4c;color:#fff;padding:13px 24px;border-radius:11px;font-size:13px;font-weight:700;box-shadow:0 12px 32px rgba(0,0,0,.24);z-index:600;animation:riseIn .22s ease both\">{{ toast }}<\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ importando }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed;inset:0;background:rgba(242,239,233,.85);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:700\">\n      <div style=\"width:34px;height:34px;border:3px solid #ddd8ce;border-top-color:#00995d;border-radius:50%;animation:spin .65s linear infinite\"><\u002Fdiv>\n      <div style=\"font-size:14px;font-weight:700;color:#004e4c\">{{ rotuloCarregando }}<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;previewLargura&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:470,&quot;min&quot;:360,&quot;max&quot;:720,&quot;step&quot;:10,&quot;unit&quot;:&quot;px&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Layout&quot;},&quot;mostrarDicas&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Layout&quot;}}\">\nconst KEY = 'montador-informativo-v1';\nconst GH_KEY = 'montador-informativo-github';\n\nclass Component extends DCLogic {\n  state = {\n    data: null,\n    selId: null,\n    modo: null,\n    previewAberto: null,\n    larguraJanela: 0,\n    extras: {},\n    toast: '',\n    importando: false,\n    modalEmbed: false,\n    embedCodigo: '',\n    copiado: false,\n    gh: null,\n    modalGh: false,\n    ghStatus: '',\n    ghOk: null,\n    publicando: false\n  };\n\n  editores = {};\n  timers = {};\n\n  componentDidMount() {\n    window.addEventListener('resize', this.onResize);\n    if (this.shellEl) this.medir(this.shellEl.getBoundingClientRect().width);\n    try {\n      const g = JSON.parse(localStorage.getItem(GH_KEY));\n      if (g) this.setState({ gh: g });\n    } catch (e) { /* sem config */ }\n    const comBuilder = (mod) => {\n      this.builder = mod;\n      let data = null;\n      try { data = JSON.parse(localStorage.getItem(KEY)); } catch (e) { data = null; }\n      if (!data || !data.edicoes) data = { edicoes: [], legados: [] };\n      if (!data.legados) data.legados = [];\n      delete data.acessos;\n      const sel = data.edicoes.length ? data.edicoes[0].id : null;\n      this.setState({ data, selId: sel });\n      if (!data.legados.length && window.LEGADOS_FRAMER) {\n        const base = window.LEGADOS_FRAMER.slice();\n        this.mut((d) => { if (!d.legados.length) d.legados = base; });\n      }\n    };\n\n    // embed-builder.js e legados.js são scripts clássicos no <helmet>;\n    // podem não ter terminado de carregar quando o componente monta.\n    const tenta = (n) => {\n      if (window.EmbedBuilder) { comBuilder(window.EmbedBuilder); return; }\n      if (n > 40) return;\n      setTimeout(() => tenta(n + 1), 50);\n    };\n    tenta(0);\n  }\n\n  medir = (w) => {\n    const larg = Math.round(w || 0);\n    if (!larg || larg === this.state.larguraJanela) return;\n    this.setState({ larguraJanela: larg });\n  };\n\n  setShellEl = (el) => {\n    if (this.shellObs) { this.shellObs.disconnect(); this.shellObs = null; }\n    this.shellEl = el || null;\n    if (!el) return;\n    this.medir(el.getBoundingClientRect().width);\n    if (typeof ResizeObserver === 'undefined') return;\n    this.shellObs = new ResizeObserver((entradas) => {\n      const e = entradas[0];\n      if (e) this.medir(e.contentRect.width);\n    });\n    this.shellObs.observe(el);\n  };\n\n  onResize = () => {\n    clearTimeout(this.timers.resize);\n    this.timers.resize = setTimeout(() => {\n      if (this.shellEl) this.medir(this.shellEl.getBoundingClientRect().width);\n      else this.medir(window.innerWidth);\n    }, 140);\n  };\n\n  componentWillUnmount() {\n    window.removeEventListener('resize', this.onResize);\n    if (this.shellObs) this.shellObs.disconnect();\n    Object.keys(this.timers).forEach((k) => clearTimeout(this.timers[k]));\n  }\n\n  componentDidUpdate() { this.syncEditores(); }\n\n  syncEditores() {\n    const ed = this.edicaoAtual();\n    if (!ed) return;\n    ed.pautas.forEach((p) => {\n      const el = this.editores[p.id];\n      if (!el) return;\n      if (document.activeElement === el) return;\n      const alvo = p.texto || '';\n      if (el.innerHTML !== alvo) el.innerHTML = alvo;\n    });\n  }\n\n  salvar(data) {\n    try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) { /* cota */ }\n  }\n\n  mut(fn) {\n    const data = JSON.parse(JSON.stringify(this.state.data || { edicoes: [], legados: [] }));\n    const out = fn(data) || data;\n    this.salvar(out);\n    this.setState({ data: out });\n    return out;\n  }\n\n  aviso(msg) {\n    this.setState({ toast: msg });\n    clearTimeout(this.timers.toast);\n    this.timers.toast = setTimeout(() => this.setState({ toast: '' }), 2600);\n  }\n\n  edicaoAtual() {\n    const d = this.state.data;\n    if (!d) return null;\n    return d.edicoes.find((e) => e.id === this.state.selId) || nu
