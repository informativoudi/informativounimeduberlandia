<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Informativo do Cooperado</title>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--g:#00995d;--p:#004e4c;--c:#b1d34b;--areia:#ece3d9}
html,body{background:#fff}
body{font-family:'Source Sans 3',system-ui,-apple-system,sans-serif;color:#3a3630;-webkit-font-smoothing:antialiased}
a{text-decoration:none;color:inherit}
img{max-width:100%;height:auto;display:block}
button{font-family:inherit;cursor:pointer;border:0;background:none}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}

/* ===== FAIXA DA DATA ===== */
.dt{background:var(--areia);border-bottom:1px solid rgba(0,78,76,.07)}
.dt-in{max-width:900px;margin:0 auto;padding:13px 26px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.dt-p{display:flex;align-items:center;gap:9px;background:#fff;border-radius:100px;padding:7px 15px 7px 9px}
.dt-p .n{background:var(--g);color:#fff;border-radius:100px;min-width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900}
.dt-p .l{font-size:13px;font-weight:800;color:var(--p)}
.dt-s{font-size:12.5px;color:#7d7669;font-weight:600}
.dt-b{font-size:9.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;padding:6px 13px;border-radius:100px;background:#fff3e0;color:#f47920;display:flex;align-items:center;gap:7px}
.hs{position:relative;margin-left:auto;flex-shrink:0}
.hs-b{display:flex;align-items:center;gap:9px;background:#fff;border-radius:100px;padding:8px 16px;font-size:12.5px;font-weight:800;color:var(--p);transition:transform .16s cubic-bezier(.2,.8,.2,1),box-shadow .2s}
.hs-b:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(7,63,45,.15)}
.hs-b svg:last-child{transition:transform .25s;opacity:.5}
.hs.on .hs-b svg:last-child{transform:rotate(180deg)}
.hs-p{position:absolute;top:calc(100% + 9px);right:0;width:318px;max-width:calc(100vw - 36px);background:#fff;border-radius:14px;box-shadow:0 20px 52px rgba(7,40,28,.26);max-height:min(62vh,404px);overflow-y:auto;opacity:0;transform:translateY(-8px) scale(.98);transform-origin:top right;pointer-events:none;transition:opacity .2s,transform .22s cubic-bezier(.2,.8,.2,1);z-index:70}
.hs.on .hs-p{opacity:1;transform:none;pointer-events:auto}
.hs-h{padding:15px 18px 12px;border-bottom:1px solid #f0ece4;position:sticky;top:0;background:#fff;z-index:2}
.hs-h .a{font-size:14px;font-weight:800;color:var(--p)}
.hs-h .b{font-size:11.5px;color:#8b8578;margin-top:2px}
.hs-y{font-size:10px;font-weight:800;color:#a49e91;letter-spacing:.13em;text-transform:uppercase;padding:13px 18px 5px;background:#faf8f4}
.hs-i{width:100%;display:flex;align-items:center;gap:11px;padding:10px 18px;text-align:left;transition:background .14s,padding-left .16s}
.hs-i:hover{background:#eef6f0;padding-left:23px}
.hs-i.on{background:#eef6f0}
.hs-d{background:var(--c);border-radius:8px 8px 0 8px;padding:5px 8px;min-width:42px;text-align:center;flex-shrink:0;display:flex;flex-direction:column}
.hs-d .d{font-size:15px;font-weight:900;color:var(--p);line-height:1}
.hs-d .m{font-size:8px;font-weight:800;color:var(--p);text-transform:uppercase;letter-spacing:.04em}
.hs-x{flex:1;min-width:0;display:flex;flex-direction:column}
.hs-x .a{font-size:13px;font-weight:700;color:#2c2a26}
.hs-x .b{font-size:11px;color:#8b8578;margin-top:1px}
.hs-t{font-size:8.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;padding:3px 8px;border-radius:100px;flex-shrink:0;background:#eef6f0;color:var(--g)}
.hs-i svg{flex-shrink:0;opacity:.4}
.dt-back{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:800;color:var(--g);background:#fff;border-radius:100px;padding:7px 15px;transition:transform .16s,box-shadow .2s}
.dt-back:hover{transform:translateX(-2px);box-shadow:0 5px 14px rgba(7,63,45,.14)}

/* ===== PAUTAS ===== */
.wrap{max-width:900px;margin:0 auto;padding:0 26px}
.pauta{padding:36px 0;border-bottom:1px solid #eeeae2;animation:up .38s ease both}
.pauta:last-child{border-bottom:0}
.pauta:nth-child(2){animation-delay:.05s}.pauta:nth-child(3){animation-delay:.1s}
.pauta:nth-child(4){animation-delay:.15s}.pauta:nth-child(5){animation-delay:.2s}
.pauta:nth-child(6){animation-delay:.25s}.pauta:nth-child(7){animation-delay:.3s}
.ptag{display:inline-block;font-size:9.5px;font-weight:800;color:var(--g);letter-spacing:.14em;text-transform:uppercase;background:#eef6f0;padding:5px 11px;border-radius:100px;margin-bottom:12px}
.ptitle{font-size:26px;font-weight:800;color:var(--p);line-height:1.14;letter-spacing:-.018em;margin-bottom:13px;text-wrap:pretty}
.pbody{font-size:15.5px;line-height:1.68;color:#4a4640}
.pbody p{margin-bottom:12px}
.pbody p:last-child{margin-bottom:0}
.pbody strong,.pbody b{font-weight:700;color:#242220}
.pbody a{color:var(--g);font-weight:600;text-decoration:underline}
.pbody ul,.pbody ol{margin:10px 0 14px 22px}
.pbody li{margin-bottom:5px}
.pimg{border-radius:14px 14px 0 14px;overflow:hidden;background:linear-gradient(135deg,var(--areia),#d4e8d0);box-shadow:0 2px 14px rgba(7,63,45,.09);transition:transform .3s cubic-bezier(.2,.8,.2,1),box-shadow .3s}
.pimg:hover{transform:translateY(-3px);box-shadow:0 14px 34px rgba(7,63,45,.16)}
.pimg img{width:100%;transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.pimg:hover img{transform:scale(1.05)}
.pimg-solo{max-width:440px;margin-top:18px}
.pgal{display:grid;gap:11px;margin-top:18px}
.pgal.n2{grid-template-columns:1fr 1fr}
.pgal.n3{grid-template-columns:repeat(3,1fr)}
.pgal.n4{grid-template-columns:1fr 1fr}
.pgal.nm{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.pgal figure{border-radius:14px 14px 0 14px;overflow:hidden;background:linear-gradient(135deg,var(--areia),#d4e8d0);box-shadow:0 2px 14px rgba(7,63,45,.09);transition:transform .3s cubic-bezier(.2,.8,.2,1),box-shadow .3s}
.pgal figure:hover{transform:translateY(-3px);box-shadow:0 14px 32px rgba(7,63,45,.18)}
.pgal img{width:100%;aspect-ratio:4/3;object-fit:cover;transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.pgal figure:hover img{transform:scale(1.06)}
.pvideo{width:100%;aspect-ratio:16/9;border-radius:14px 14px 0 14px;overflow:hidden;margin-top:18px;box-shadow:0 4px 22px rgba(7,63,45,.14);background:#0d1210}
.pvideo iframe{width:100%;height:100%;border:0}
.pbtns{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.pbtn{display:inline-flex;align-items:center;gap:9px;padding:12px 22px;border-radius:100px;font-size:13px;font-weight:800;background:var(--g);color:#fff;transition:transform .18s cubic-bezier(.2,.8,.2,1),box-shadow .22s}
.pbtn:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(0,153,93,.34)}
.pbtn:active{transform:scale(.97)}
.pbtn.alt{background:var(--c);color:var(--p)}
.pbtn.alt:hover{box-shadow:0 8px 22px rgba(177,211,75,.44)}
.pbtn svg{flex-shrink:0}
.phi{margin-top:20px;background:#eef6f0;border-left:4px solid var(--g);border-radius:0 12px 12px 0;padding:17px 20px;font-size:14.5px;line-height:1.62;color:#00573a}
.phi p{margin-bottom:8px}.phi p:last-child{margin-bottom:0}
.phi strong{font-weight:800}
.pev{margin-top:24px;background:#eef6f0;border-radius:14px;padding:20px}
.pev-l{font-size:9.5px;font-weight:800;color:var(--g);letter-spacing:.14em;text-transform:uppercase;margin-bottom:14px}
.pev-c{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.pev-d{background:var(--c);border-radius:12px 12px 0 12px;padding:13px 19px;text-align:center;flex-shrink:0;min-width:86px}
.pev-d .d{font-size:35px;font-weight:900;color:var(--p);line-height:1}
.pev-d .m{font-size:12px;font-weight:800;color:var(--p);text-transform:uppercase}
.pev-x{flex:1;min-width:190px}
.pev-t{font-size:18.5px;font-weight:800;color:var(--p);margin-bottom:7px}
.pev-i{font-size:13.5px;color:#4a4640;line-height:1.62}
.pev-i div{display:flex;align-items:center;gap:7px}
.pev-b{font-size:10.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;background:var(--g);color:#fff;padding:9px 17px;border-radius:100px;flex-shrink:0}
/* ===== OUTROS ACESSOS ===== */
.oa{background:#faf8f4;border-top:1px solid #eeeae2;margin-top:6px}
.oa-in{max-width:900px;margin:0 auto;padding:32px 26px 44px}
.oa-l{font-size:9.5px;font-weight:800;color:#8b8578;letter-spacing:.14em;text-transform:uppercase;margin-bottom:14px}
.oa-g{display:grid;grid-template-columns:repeat(auto-fit,minmax(196px,1fr));gap:11px}
.oa-c{display:flex;align-items:center;gap:12px;border-radius:12px 12px 0 12px;padding:16px 17px;transition:transform .2s cubic-bezier(.2,.8,.2,1),box-shadow .22s}
.oa-c:hover{transform:translateY(-3px);box-shadow:0 12px 28px rgba(7,63,45,.16)}
.oa-c .t{flex:1;min-width:0;font-size:13px;font-weight:800;line-height:1.28}
.oa-c .i{width:25px;height:25px;flex-shrink:0;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:transform .2s}
.oa-c:hover .i{transform:translate(2px,-2px)}
.oa-c.a1{background:#fff;color:#2c4a10;box-shadow:inset 0 0 0 1px #e4e0d8}
.oa-c.a1 .i{background:#f2efe9;color:#2c4a10}
.oa-c.a2{background:#ee7d28;color:#fff}
.oa-c.a2 .i{background:rgba(255,255,255,.26);color:#fff}
.oa-c.a3{background:var(--g);color:#fff}
.oa-c.a3 .i{background:rgba(255,255,255,.26);color:#fff}
.oa-c.a4{background:var(--p);color:#fff}
.oa-c.a4 .i{background:rgba(177,211,75,.34);color:var(--c)}

.vazio{padding:80px 26px;text-align:center;color:#8b8578;font-size:15px}

@media(max-width:760px){
  .oa-in{padding:28px 18px 38px}
  .oa-g{grid-template-columns:1fr 1fr}
  .dt-in{padding:12px 18px;gap:10px}
  .hs{margin-left:0}
  .hs-p{right:auto;left:0;transform-origin:top left}
  .wrap{padding:0 18px}
  .pauta{padding:28px 0}
  .ptitle{font-size:21px}
  .pbody{font-size:15px}
  .pgal.n3,.pgal.n4,.pgal.nm{grid-template-columns:1fr 1fr}
  .pev-c{flex-direction:column;align-items:flex-start}
  .pev-b{align-self:flex-start}
}
@media(max-width:420px){
  .ptitle{font-size:19px}
  .pgal.n2,.pgal.n3,.pgal.n4,.pgal.nm{grid-template-columns:1fr}
  .oa-g{grid-template-columns:1fr}
}
</style>
</head>
