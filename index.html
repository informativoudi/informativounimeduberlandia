<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Informativo do Cooperado</title>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--g:#00995d;--p:#004e4c;--c:#b1d34b;--areia:#ece3d9}
html,body{background:#fff}
body{font-family:'Source Sans 3',system-ui,-apple-system,sans-serif;color:#3a3630;-webkit-font-smoothing:antialiased}
a{text-decoration:none;color:inherit}
img{max-width:100%;height:auto;display:block}
button{font-family:inherit;cursor:pointer;border:0;background:none}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}

/* ===== FAIXA DA EDIÇÃO ===== */
.dt{background:var(--areia);border-bottom:1px solid rgba(0,78,76,.08);position:relative}
.dt:before{content:'';position:absolute;left:0;top:0;bottom:0;width:5px;background:linear-gradient(180deg,var(--c),var(--g))}
.dt-in{max-width:900px;margin:0 auto;padding:22px 26px 24px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.dt-cal{display:flex;align-items:stretch;border-radius:13px 13px 0 13px;overflow:hidden;flex-shrink:0;box-shadow:0 4px 16px rgba(7,63,45,.13)}
.dt-cal .dd{background:var(--g);color:#fff;padding:12px 16px;text-align:center;display:flex;align-items:center;justify-content:center;min-width:58px}
.dt-cal .dd .n{font-size:32px;font-weight:900;line-height:1;letter-spacing:-.03em}
.dt-cal .mm{background:var(--c);color:var(--p);padding:0 11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;line-height:1}
.dt-cal .mm .m{font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.1em}
.dt-cal .mm .y{font-size:10px;font-weight:800;letter-spacing:.06em;opacity:.78}
.dt-cal.arq .dd{background:var(--p)}
.dt-cal.arq .mm{background:#d7d1c4;color:#3c382f}
.dt-x{flex:1;min-width:190px;display:flex;flex-direction:column;gap:5px}
.dt-l{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.dt-l .k{font-size:9.5px;font-weight:800;letter-spacing:.15em;text-transform:uppercase;color:var(--p)}
.dt-l .k.arq{color:#7a4c12}
.dt-l .dash{flex:1;min-width:24px;height:1.5px;background:linear-gradient(90deg,rgba(0,153,93,.4),rgba(0,153,93,0));border-radius:1px}
.dt-t{font-size:23px;font-weight:800;color:var(--p);line-height:1.1;letter-spacing:-.02em}
.dt-s{font-size:12.5px;color:#5c574d;font-weight:600}
.dt-b{align-self:flex-start;font-size:9.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;padding:6px 13px;border-radius:100px;background:#fff3e0;color:#a04a00;display:inline-flex;align-items:center;gap:7px}
.hs{position:relative;margin-left:auto;flex-shrink:0}
.hs-b{display:flex;align-items:center;gap:9px;background:#fff;border-radius:100px;padding:8px 16px;font-size:12.5px;font-weight:800;color:var(--p);transition:transform .16s cubic-bezier(.2,.8,.2,1),box-shadow .2s}
.hs-b:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(7,63,45,.15)}
.hs-b svg:last-child{transition:transform .25s;opacity:.5}
.hs.on .hs-b svg:last-child{transform:rotate(180deg)}
.hs-p{position:absolute;top:calc(100% + 9px);right:0;width:318px;max-width:calc(100vw - 36px);background:#fff;border-radius:14px;box-shadow:0 20px 52px rgba(7,40,28,.26);max-height:min(62vh,404px);overflow-y:auto;opacity:0;transform:translateY(-8px) scale(.98);transform-origin:top right;pointer-events:none;transition:opacity .2s,transform .22s cubic-bezier(.2,.8,.2,1);z-index:70}
.hs.on .hs-p{opacity:1;transform:none;pointer-events:auto}
.hs-h{padding:15px 18px 12px;border-bottom:1px solid #f0ece4;position:sticky;top:0;background:#fff;z-index:2}
.hs-h .a{font-size:14px;font-weight:800;color:var(--p)}
.hs-h .b{font-size:11.5px;color:#5c574d;margin-top:2px}
.hs-y{font-size:10px;font-weight:800;color:#5c574d;letter-spacing:.13em;text-transform:uppercase;padding:13px 18px 5px;background:#faf8f4}
.hs-i{width:100%;display:flex;align-items:center;gap:11px;padding:10px 18px;text-align:left;transition:background .14s,padding-left .16s}
.hs-i:hover{background:#eef6f0;padding-left:23px}
.hs-i.on{background:#eef6f0}
.hs-d{background:var(--c);border-radius:8px 8px 0 8px;padding:5px 8px;min-width:42px;text-align:center;flex-shrink:0;display:flex;flex-direction:column}
.hs-d .d{font-size:15px;font-weight:900;color:var(--p);line-height:1}
.hs-d .m{font-size:8px;font-weight:800;color:var(--p);text-transform:uppercase;letter-spacing:.04em}
.hs-x{flex:1;min-width:0;display:flex;flex-direction:column}
.hs-x .a{font-size:13px;font-weight:700;color:#2c2a26}
.hs-x .b{font-size:11px;color:#5c574d;margin-top:1px}
.hs-t{font-size:8.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;padding:3px 8px;border-radius:100px;flex-shrink:0;background:#eef6f0;color:var(--g)}
.hs-i svg{flex-shrink:0;opacity:.4}
.dt-back{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:800;color:var(--g);background:#fff;border-radius:100px;padding:7px 15px;transition:transform .16s,box-shadow .2s}
.dt-back:hover{transform:translateX(-2px);box-shadow:0 5px 14px rgba(7,63,45,.14)}

/* ===== PAUTAS ===== */
.wrap{max-width:900px;margin:0 auto;padding:0 26px}
.pauta{padding:36px 0;border-bottom:1px solid #eeeae2;animation:up .38s ease both}
.pauta:last-child{border-bottom:0}
.pauta:nth-child(2){animation-delay:.05s}.pauta:nth-child(3){animation-delay:.1s}
.pauta:nth-child(4){animation-delay:.15s}.pauta:nth-child(5){animation-delay:.2s}
.pauta:nth-child(6){animation-delay:.25s}.pauta:nth-child(7){animation-delay:.3s}
.ptag{display:inline-block;font-size:9.5px;font-weight:800;color:var(--p);letter-spacing:.14em;text-transform:uppercase;background:#eef6f0;padding:5px 11px;border-radius:100px;margin-bottom:12px}
.ptitle{font-size:26px;font-weight:800;color:var(--p);line-height:1.14;letter-spacing:-.018em;margin-bottom:13px;text-wrap:pretty}
.pbody{font-size:15.5px;line-height:1.68;color:#4a4640}
.pbody p{margin-bottom:12px}
.pbody p:last-child{margin-bottom:0}
.pbody strong,.pbody b{font-weight:700;color:#242220}
.pbody a{color:var(--g);font-weight:600;text-decoration:underline}
.pbody ul,.pbody ol{margin:10px 0 14px 22px}
.pbody li{margin-bottom:5px}
.pimg{border-radius:14px 14px 0 14px;overflow:hidden;background:linear-gradient(135deg,var(--areia),#d4e8d0);box-shadow:0 2px 14px rgba(7,63,45,.09);transition:transform .3s cubic-bezier(.2,.8,.2,1),box-shadow .3s}
.pimg:hover{transform:translateY(-3px);box-shadow:0 14px 34px rgba(7,63,45,.16)}
.pimg img{width:100%;transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.pimg:hover img{transform:scale(1.05)}
.pimg-solo{max-width:440px;margin-top:18px}
.pgal{display:grid;gap:11px;margin-top:18px}
.pgal.n2{grid-template-columns:1fr 1fr}
.pgal.n3{grid-template-columns:repeat(3,1fr)}
.pgal.n4{grid-template-columns:1fr 1fr}
.pgal.nm{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.pgal figure{border-radius:14px 14px 0 14px;overflow:hidden;background:linear-gradient(135deg,var(--areia),#d4e8d0);box-shadow:0 2px 14px rgba(7,63,45,.09);transition:transform .3s cubic-bezier(.2,.8,.2,1),box-shadow .3s}
.pgal figure:hover{transform:translateY(-3px);box-shadow:0 14px 32px rgba(7,63,45,.18)}
.pgal img{width:100%;aspect-ratio:4/3;object-fit:cover;transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.pgal figure:hover img{transform:scale(1.06)}
.pvideo{width:100%;aspect-ratio:16/9;border-radius:14px 14px 0 14px;overflow:hidden;margin-top:18px;box-shadow:0 4px 22px rgba(7,63,45,.14);background:#0d1210}
.pvideo iframe{width:100%;height:100%;border:0}
.pbtns{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.pbtn{display:inline-flex;align-items:center;gap:9px;padding:12px 22px;border-radius:100px;font-size:13px;font-weight:800;background:var(--g);color:#fff;transition:transform .18s cubic-bezier(.2,.8,.2,1),box-shadow .22s}
.pbtn:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(0,153,93,.34)}
.pbtn:active{transform:scale(.97)}
.pbtn.alt{background:var(--c);color:var(--p)}
.pbtn.alt:hover{box-shadow:0 8px 22px rgba(177,211,75,.44)}
.pbtn svg{flex-shrink:0}
.phi{margin-top:20px;background:#eef6f0;border-left:4px solid var(--g);border-radius:0 12px 12px 0;padding:17px 20px;font-size:14.5px;line-height:1.62;color:#00573a}
.phi p{margin-bottom:8px}.phi p:last-child{margin-bottom:0}
.phi strong{font-weight:800}
.pev{margin-top:24px;background:#eef6f0;border-radius:14px;padding:20px}
.pev-l{font-size:9.5px;font-weight:800;color:var(--g);letter-spacing:.14em;text-transform:uppercase;margin-bottom:14px}
.pev-c{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.pev-d{background:var(--c);border-radius:12px 12px 0 12px;padding:13px 19px;text-align:center;flex-shrink:0;min-width:86px}
.pev-d .d{font-size:35px;font-weight:900;color:var(--p);line-height:1}
.pev-d .m{font-size:12px;font-weight:800;color:var(--p);text-transform:uppercase}
.pev-x{flex:1;min-width:190px}
.pev-t{font-size:18.5px;font-weight:800;color:var(--p);margin-bottom:7px}
.pev-i{font-size:13.5px;color:#4a4640;line-height:1.62}
.pev-i div{display:flex;align-items:center;gap:7px}
.pev-b{font-size:10.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;background:var(--g);color:#fff;padding:9px 17px;border-radius:100px;flex-shrink:0}
/* ===== FECHAMENTO: ACESSOS + RODAPÉ ===== */
.end{background:#fff;border-top:5px solid var(--g);margin-top:14px}
.end-in{max-width:900px;margin:0 auto;padding:36px 26px 40px}

.oa-l{display:flex;align-items:center;gap:12px;font-size:10px;font-weight:800;color:var(--p);letter-spacing:.15em;text-transform:uppercase;margin-bottom:16px}
.oa-l:after{content:'';flex:1;height:1px;background:#e8e4da}
.oa-g{display:grid;grid-template-columns:repeat(auto-fit,minmax(196px,1fr));gap:10px}
.oa-c{display:flex;align-items:center;gap:12px;background:#fff;border:1.5px solid #e4e0d8;border-radius:12px 12px 0 12px;padding:15px 16px;color:var(--p);transition:border-color .2s,transform .2s cubic-bezier(.2,.8,.2,1),box-shadow .22s}
.oa-c:hover{border-color:var(--g);color:var(--p);transform:translateY(-3px);box-shadow:0 10px 24px rgba(7,63,45,.12)}
.oa-c .t{flex:1;min-width:0;font-size:13px;font-weight:700;line-height:1.3}
.oa-c .i{width:24px;height:24px;flex-shrink:0;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#eef6f0;color:var(--g);transition:background .2s,transform .2s}
.oa-c:hover .i{background:var(--g);color:#fff;transform:translate(2px,-2px)}
.oa-c .bar{width:3px;align-self:stretch;border-radius:2px;flex-shrink:0}
.oa-c.a1 .bar{background:var(--g)}
.oa-c.a2 .bar{background:#ee7d28}
.oa-c.a3 .bar{background:var(--c)}
.oa-c.a4 .bar{background:var(--p)}

.ft{padding:0}
.ft-sep{height:1px;background:#e8e4da;margin:34px 0 28px}
.ft-in{display:flex;align-items:flex-start;justify-content:space-between;gap:40px;flex-wrap:wrap}
.ft-mk{flex-shrink:0}
.ft-mk img{display:block;height:54px;width:auto}
.ft-c{flex:1;min-width:280px}
.ft-h{font-size:10px;font-weight:800;color:var(--g);letter-spacing:.15em;text-transform:uppercase}
.ft-u{font-size:19px;font-weight:800;color:var(--p);margin-top:5px;letter-spacing:-.015em}
.ft-rows{display:flex;flex-direction:column;gap:9px;margin-top:16px}
.ft-r{display:flex;align-items:center;gap:9px;font-size:14px;line-height:1.5;color:#3f3b34}
.ft-r b{font-weight:700;color:var(--p)}
.ft-r a{color:var(--g);font-weight:700;transition:color .18s}
.ft-r a:hover{color:var(--p)}
.ft-r svg{flex-shrink:0;opacity:.85}
.ft-ans{display:flex;justify-content:flex-end;margin-top:30px;padding-top:18px;border-top:1px solid #efece4}
.ft-ans span{font-size:11px;color:#5c574d;font-weight:600}

.vazio{padding:80px 26px;text-align:center;color:#5c574d;font-size:15px}

@media(max-width:760px){
  .end-in{padding:30px 18px 32px}
  .oa-g{grid-template-columns:1fr 1fr}
  .ft-in{gap:26px}
  .ft-mk img{height:46px}
  .ft-ans{justify-content:flex-start;margin-top:24px}
  .dt-in{padding:20px 18px 22px;gap:16px}
  .dt-t{font-size:19px}
  .dt-cal .dd{min-width:52px;padding:11px 13px}
  .dt-cal .dd .n{font-size:28px}
  .hs{margin-left:0}
  .hs-p{right:auto;left:0;transform-origin:top left}
  .wrap{padding:0 18px}
  .pauta{padding:28px 0}
  .ptitle{font-size:21px}
  .pbody{font-size:15px}
  .pgal.n3,.pgal.n4,.pgal.nm{grid-template-columns:1fr 1fr}
  .pev-c{flex-direction:column;align-items:flex-start}
  .pev-b{align-self:flex-start}
}
@media(max-width:420px){
  .ptitle{font-size:19px}
  .pgal.n2,.pgal.n3,.pgal.n4,.pgal.nm{grid-template-columns:1fr}
  .oa-g{grid-template-columns:1fr}
  .ft-c{min-width:0}
}
</style>
</head>

<script>window.__BOOT={"dados":{"edicoes":[{"id":"e7e7blyk","rotulo":"02/10/2026","dia":"2","mes":"out","ano":"2026","curta":"02/10/2026","status":"online","pautas":[{"sessao":"GOVERNANÇA","titulo":"Conselho de Administração comunica medidas de gestão e decisão sobre a Festa do Dia do Médico","texto":"<p>Comunicação sobre medidas de gestão, redução de despesas e a decisão excepcional de não realizar a Festa do Dia do Médico em 2026.</p><p>Diante dos resultados econômico-financeiros de 2025 e do cenário projetado para 2026, o Conselho de Administração e a Diretoria da Unimed Uberlândia vêm adotando uma condução diligente e austera na gestão das despesas da cooperativa. O objetivo é melhorar os resultados do exercício, preservar o caixa e fortalecer a sustentabilidade da Unimed Uberlândia no longo prazo.</p><p><strong>Medidas para redução de despesas</strong></p><p>Redução do número de colaboradores; medidas técnico-administrativas voltadas à redução da sinistralidade e melhoria da eficiência operacional; redução de despesas administrativas gerais; ações de combate a desvios de conduta.</p>","imagem":"","imagens":[],"video":"","destaque":"<p>As medidas vêm sendo conduzidas sem comprometer a remuneração dos cooperados, incluindo iniciativas de valorização da produção médica, como o Programa Valoriza.</p>","botoes":[{"texto":"Acesse a Sala","link":""}],"evento":{"ativo":true,"titulo":"IA par Marketing","dia":"28","mes":"Set","local":"","horario":"12h40","formato":"Online"}},{"sessao":"TECNOLOGIA","titulo":"Workshop de Letramento em IA para Cooperados","texto":"<p>Para orientar os cooperados sobre como o uso da IA pode contribuir com o seu trabalho, a Unimed Uberlândia promove o Workshop de Letramento em IA para Cooperados.</p><p>O evento será conduzido por Fred Parreira e Marcello Nasser, que vão abordar casos reais de aplicação da IA na medicina, como análise e síntese de informações, otimização de processos de trabalho, entre outros temas.</p><p><strong>Confira a prog   function vNav(e) {
    var lista = [];
    arquivadas.forEach(function (a) {
      var q = quebra(a.curta || a.rotulo);
      lista.push({ q: q, rot: a.curta || a.rotulo, id: a.id, link: null, n: (a.pautas || []).length });
    });
    (DADOS.legados || []).forEach(function (g) {
      if (!g.link) return;
      lista.push({ q: quebra(g.rotulo), rot: g.rotulo, id: null, link: g.link, n: 0 });
    });
    if (!lista.length) return '';

    var anos = [];
    lista.forEach(function (i) { if (anos.indexOf(i.q.ano) < 0) anos.push(i.q.ano); });
    anos.sort().reverse();

    var corpo = anos.map(function (ano) {
      var itens = lista.filter(function (i) { return i.q.ano === ano; }).map(function (i) {
        var attr = i.link ? 'data-ext="' + esc(i.link) + '"' : 'data-open="' + i.id + '"';
        var sub = i.link ? 'Arquivo no Framer' : (i.n + (i.n === 1 ? ' pauta' : ' pautas'));
        var cauda = i.link ? IC.ext : '';
        return '<button class="hs-i' + (i.id && i.id === e.id ? ' on' : '') + '" ' + attr + '>'
          + '<span class="hs-d"><span class="d">' + esc(i.q.d) + '</span><span class="m">' + esc(i.q.m) + '</span></span>'
          + '<span class="hs-x"><span class="a">' + esc(i.rot) + '</span><span class="b">' + sub + '</span></span>'
          + cauda + '</button>';
      }).join('');
      return '<div class="hs-y">' + esc(ano) + '</div>' + itens;
    }).join('');

    var topo = (atual && atual.id !== e.id)
      ? '<button class="hs-i" data-open="' + atual.id + '" style="background:#eef6f0">'
        + '<span class="hs-d"><span class="d">' + esc(quebra(atual.curta || atual.rotulo).d) + '</span><span class="m">' + esc(quebra(atual.curta || atual.rotulo).m) + '</span></span>'
        + '<span class="hs-x"><span class="a">Edição atual</span><span class="b">' + esc(atual.rotulo) + '</span></span>'

      + '<button class="hs-b" data-menu="1">' + IC.hist + 'Edições anteriores' + IC.baixo + '</button>'

      + topo + corpo
      + '</div></div>';
  }

  function vFaixa(e) {
    var arq = e.status === 'arquivado';
    var esp = e.status === 'espelho';
    var n = (e.pautas || []).length;
    var q = quebra(e.curta || e.rotulo);
    var mes = (q.m || '').toUpperCase();

    function dataExtenso(rot) {
      var m = String(rot || '').match(/(\d{1,2})\D+(\d{1,2})\D+(\d{2,4})/);
      if (!m) return esc(rot || '');
      var ano = m[3].length === 2 ? 2000 + parseInt(m[3], 10) : parseInt(m[3], 10);
      var dt = new Date(ano, parseInt(m[2], 10) - 1, parseInt(m[1], 10));
      var DIAS = ['Domingo', 'Segunda-feira', 'Terça-feira', 'Quarta-feira', 'Quinta-feira', 'Sexta-feira', 'Sábado'];
      var MESES = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
      return DIAS[dt.getDay()] + ', ' + dt.getDate() + ' de ' + MESES[dt.getMonth()];
    }
    var chave = esp ? 'Prévia interna' : (arq ? 'Edição arquivada' : 'Edição atual');
    var sub = arq
      ? 'Publicada em ' + esc(e.rotulo)
      : n + (n === 1 ? ' pauta nesta edição' : ' pautas nesta edição');

    return '<div class="dt"><div class="dt-in">'
      + '<div class="dt-cal' + (arq ? ' arq' : '') + '">'
      + '<div class="dd"><span class="n">' + esc(q.d) + '</span></div>'
      + '<div class="mm"><span class="m">' + esc(mes) + '</span><span class="y">' + esc(q.ano) + '</span></div>'

      + '<div class="dt-x">'
      + '<div class="dt-l"><span class="k' + (arq ? ' arq' : '') + '">' + chave + '</span><span class="dash"></span></div>'

      + (esp ? '<span class="dt-b">' + IC.olho + 'Não publicado</span>' : '')
      + '</div>'
      + vNav(e)
      + '</div></div>';
  }

  function ligar() {
    var mb = app.querySelector('[data-menu]');
    if (mb) {
      mb.addEventListener('click', function (ev) {
        ev.stopPropagation();
        menuAberto = !menuAberto;
        var m = app.querySelector('#hs');
        if (m) m.classList.toggle('on', menuAberto);
      });
    }
    app.querySelectorAll('[data-open]').forEach(function (el) {
      el.addEventListener('click', function (ev) {
        ev.preventDefault();
        edId = el.getAttribute('data-open');
        menuAberto = false;
        aberto = false;
        render();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });
    });
    app.querySelectorAll('[data-ext]').forEach(function (el) {
      el.addEventListener('click', function () { window.open(el.getAttribute('data-ext'), '_blank', 'noopener'); });
    });
  }

  document.addEventListener('click', function (ev) {
    var m = app.querySelector('#hs');
    if (m && menuAberto && !m.contains(ev.target)) { menuAberto = false; m.classList.remove('on'); }
  });
  document.addEventListener('keydown', function (ev) {
    if (ev.key !== 'Escape' || !menuAberto) return;
    var m = app.querySelector('#hs');
    menuAberto = false;
    if (m) m.classList.remove('on');
  });

  // Reporta a altura ao container (Framer) para o iframe crescer sozinho.
  var ultima = 0;
  function avisaAltura() {
    var h = Math.ceil(document.documentElement.getBoundingClientRect().height);
    if (!h || Math.abs(h - ultima) < 2) return;
    ultima = h;
    try { window.parent.postMessage({ tipo: 'informativo:altura', altura: h }, '*'); } catch (e) { /* noop */ }
  }
  if (typeof ResizeObserver !== 'undefined') {
    new ResizeObserver(avisaAltura).observe(document.documentElement);
  }
  window.addEventListener('load', avisaAltura);
  window.addEventListener('resize', avisaAltura);
  setInterval(avisaAltura, 900);

  render();
  avisaAltura();
})(window.__BOOT);</script>
